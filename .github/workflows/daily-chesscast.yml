name: Daily Chesscast

on:
  workflow_dispatch:
    inputs:
      max_games:
        description: Number of complete games to stream (defaults to one for manual runs)
        required: true
        default: 1
        type: number

permissions:
  contents: read

concurrency:
  group: daily-chesscast
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      YOUTUBE_RTMP_URL: ${{ secrets.YOUTUBE_RTMP_URL }}
      YOUTUBE_VERTICAL_RTMP_URL: ${{ secrets.YOUTUBE_VERTICAL_RTMP_URL }}
      YOUTUBE_STREAM_URL: rtmp://a.rtmp.youtube.com/live2
      YOUTUBE_VERTICAL_STREAM_URL: rtmp://a.rtmp.youtube.com/live2
      HISTORICAL_MOVE_DELAY: "1.5"
      STOCKFISH_DEPTH: "22"
      MAX_GAMES: ${{ github.event.inputs.max_games || '100' }}
      MAX_STREAM_SECONDS: "19800"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: output/historical-games.seen
          key: chesscast-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            chesscast-history-${{ github.ref_name }}-

      - name: Validate stream secrets
        shell: bash
        run: |
          if [[ -z "$YOUTUBE_RTMP_URL" || -z "$YOUTUBE_VERTICAL_RTMP_URL" ]]; then
            echo "Set YOUTUBE_RTMP_URL and YOUTUBE_VERTICAL_RTMP_URL in repository Actions secrets."
            exit 1
          fi

      - name: Build streamer
        run: docker build -t chesscast:local .

      - name: Stream requested complete games
        run: |
          mkdir -p output
          docker run --rm --init --name chesscast-daily --stop-timeout 60 \
            --env YOUTUBE_RTMP_URL \
            --env YOUTUBE_VERTICAL_RTMP_URL \
            --env YOUTUBE_STREAM_URL \
            --env YOUTUBE_VERTICAL_STREAM_URL \
            --env HISTORICAL_MOVE_DELAY \
            --env STOCKFISH_DEPTH \
            --env MAX_GAMES \
            --env MAX_STREAM_SECONDS \
            --env HISTORICAL_GAME_CACHE=/output/historical-games \
            --env HISTORICAL_GAME_HISTORY=/output/historical-games.seen \
            -v "$PWD/output:/output" \
            chesscast:local python -m chesscast.main --max-games "$MAX_GAMES" \
              --max-runtime-seconds "$MAX_STREAM_SECONDS"
